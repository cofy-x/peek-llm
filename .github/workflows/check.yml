name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  self-contained-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python tooling
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.25'
      - name: Install locked Python environment
        run: uv sync --locked
      - name: Validate HTML and Python tooling
        run: make check-html

  source-exhibits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned authoring toolchain
        run: |
          corepack enable
          corepack prepare pnpm@11.5.1 --activate
          pnpm install --frozen-lockfile
      - name: Check source exhibits
        run: pnpm check:source
