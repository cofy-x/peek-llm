name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require Actions publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)
          if [ "$mode" != "workflow" ]; then
            echo "::error::Set Settings → Pages → Source to GitHub Actions. Branch publishing serves unbuilt source."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned authoring toolchain
        run: |
          corepack enable
          corepack prepare pnpm@11.5.1 --activate
          pnpm install --frozen-lockfile
      - name: Set up Python tooling
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.25'
      - name: Install locked Python environment
        run: uv sync --locked
      - name: Validate and build the exact revision being published
        run: pnpm check
      - name: Record deployment checksums
        run: node scripts/check-deployment.mjs record dist "$RUNNER_TEMP/deployment-checks.json"
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-checks
          path: ${{ runner.temp }}/deployment-checks.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload built site only
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: deployment-checks
          path: ${{ runner.temp }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public entries and runtime assets
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/check-deployment.mjs verify "$SITE_URL" "$RUNNER_TEMP/deployment-checks.json"
