<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23efece4'/%3E%3Cpath d='M9 32s8.5-14 23-14 23 14 23 14-8.5 14-23 14S9 32 9 32Z' fill='none' stroke='%23a1642f' stroke-width='5'/%3E%3Crect x='22' y='22' width='20' height='20' rx='3' fill='%23a1642f'/%3E%3C/svg%3E">
  <title>Concept — Peek LLM</title>

  <!-- END THIRD-PARTY STYLES -->
  <style>
    /* Design tokens: keep in sync with templates/design-tokens.html.
       This shell provides layout mechanics; visual identity lives there. */
    :root {
      color-scheme: light;
      --bg: #efece4;
      --ink: #2e2b25;
      --ink-soft: rgba(46, 43, 37, 0.84);
      --ink-subtle: rgba(46, 43, 37, 0.78);
      --muted: #716c5f;
      --panel: #f8f6f0;
      --line: rgba(46, 43, 37, 0.18);
      --line-strong: rgba(46, 43, 37, 0.42);
      --accent: #a1642f;
      --accent-ink: #7c4c1f;
      --accent-wash: rgba(161, 100, 47, 0.09);
      --violet: #6f63b8;
      --amber: #b45309;
      --rose: #b03a52;
      --green: #4a7c43;
      --blue: #3e6da8;
      --orange: #c25e1a;
      --pink: #a05195;
      --radius: 6px;
      --ease: cubic-bezier(.2, .8, .2, 1);
      --font-serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, ui-serif, serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    * { box-sizing: border-box; }

    body { margin: 0; min-height: 100vh; line-height: 1.55; background: var(--bg); }

    a { color: var(--accent-ink); }
    a:focus-visible, button:focus-visible { outline: 2px solid rgba(161, 100, 47, 0.55); outline-offset: 2px; }

    .shell { width: min(960px, calc(100% - 32px)); margin: 0 auto; padding: 26px 0 80px; }

    header.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .breadcrumbs { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .brand { display: flex; align-items: center; gap: 10px; color: var(--ink); font-family: var(--font-serif); font-weight: 700; font-size: 17px; letter-spacing: 0.01em; text-decoration: none; }
    .brand svg { width: 20px; height: 20px; color: var(--accent); }
    .crumb-sep { color: var(--line-strong); }
    .concept-link { color: var(--muted); font-size: 13.5px; text-decoration: none; }
    .concept-link:hover { color: var(--ink); }
    .label { margin: 0; color: var(--muted); font-size: 11.5px; font-weight: 600; letter-spacing: 0.13em; text-transform: uppercase; }

    .plate-kicker { margin: 34px 0 6px; }
    h1 { margin: 0 0 10px; font-family: var(--font-serif); font-weight: 700; font-size: clamp(40px, 7vw, 68px); line-height: 1.02; letter-spacing: -0.015em; }
    h1 span { color: var(--accent-ink); font-style: italic; }
    h1::after { content: ""; display: block; width: 72px; margin-top: 16px; border-bottom: 2px solid var(--ink); }
    h2 { margin: 0 0 6px; font-family: var(--font-serif); font-weight: 700; font-size: clamp(26px, 4vw, 36px); letter-spacing: -0.01em; }
    .signpost { margin: 0 0 18px; color: var(--muted); font-size: 16.5px; max-width: 620px; }

    section { margin-top: 72px; }
    .reveal { opacity: 0; transform: translateY(22px); transition: opacity 700ms var(--ease), transform 700ms var(--ease); }
    .reveal.on { opacity: 1; transform: none; }

    /* Hero stage: the primary interaction lives here, on the first screen.
       Corner-bracket frame over a faint full border, no shadow. */
    .stage {
      margin-top: 26px; padding: 26px; border: 1px solid var(--line); background:
        linear-gradient(var(--line-strong), var(--line-strong)) left top / 18px 1.5px,
        linear-gradient(var(--line-strong), var(--line-strong)) left top / 1.5px 18px,
        linear-gradient(var(--line-strong), var(--line-strong)) right top / 18px 1.5px,
        linear-gradient(var(--line-strong), var(--line-strong)) right top / 1.5px 18px,
        linear-gradient(var(--line-strong), var(--line-strong)) left bottom / 18px 1.5px,
        linear-gradient(var(--line-strong), var(--line-strong)) left bottom / 1.5px 18px,
        linear-gradient(var(--line-strong), var(--line-strong)) right bottom / 18px 1.5px,
        linear-gradient(var(--line-strong), var(--line-strong)) right bottom / 1.5px 18px,
        var(--panel);
      background-repeat: no-repeat;
    }

    button {
      min-height: 40px; padding: 0 18px; border: 1px solid var(--line-strong); border-radius: 3px;
      background: var(--panel); color: var(--ink); font: 600 12.5px/1 inherit; font-family: inherit;
      letter-spacing: 0.09em; text-transform: uppercase; cursor: pointer;
    }
    button:hover { border-color: var(--ink); }
    button.primary { border-color: transparent; background: var(--accent); color: #f8f6f0; }
    button:disabled { opacity: 0.4; cursor: default; }

    footer { margin-top: 72px; padding-top: 22px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
    footer a { color: var(--muted); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-delay: 0ms !important; transition-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
      .reveal { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="breadcrumbs">
        <a class="brand" href="../index.html" aria-label="Back to Peek LLM home">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2.5 12s3.5-5.4 9.5-5.4 9.5 5.4 9.5 5.4-3.5 5.4-9.5 5.4S2.5 12 2.5 12Z" stroke="currentColor" stroke-width="1.8"/><rect x="8.2" y="8.2" width="7.6" height="7.6" rx="1.2" fill="currentColor" stroke="none"/></svg>
          Peek LLM
        </a>
        <span class="crumb-sep" aria-hidden="true">/</span>
        <a class="concept-link" href="./index.html">Concept</a>
      </div>
      <p class="label">Conceptual illustration · replace with the data label</p>
    </header>

    <main>
      <p class="label plate-kicker">Plate 0 — Concept</p>
      <h1>One concept. <span>Zero paragraphs.</span></h1>
      <p class="signpost">One-line signpost: what the learner is about to see and do.</p>

      <div class="stage">
        <!-- The primary interaction lives here, above the fold. -->
        <button id="reset" type="button">Reset</button>
      </div>

      <section class="reveal" aria-labelledby="sources">
        <h2 id="sources">Sources</h2>
        <p class="signpost"><a href="https://example.com/primary-source" rel="noreferrer">Replace with a primary source</a></p>
      </section>
    </main>

    <footer>
      <span>Peek LLM · Concept · <a href="./index.html">Concept index</a></span>
      <span><a href="../index.html">Home</a> · <a href="https://github.com/cofy-x/peek-llm" rel="noreferrer">GitHub</a></span>
    </footer>
  </div>

  <script>
    (() => {
      "use strict";

      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      // Reveal sections as they enter the viewport; static under reduced motion.
      if (reducedMotion || !("IntersectionObserver" in window)) {
        document.querySelectorAll(".reveal").forEach((el) => el.classList.add("on"));
      } else {
        const obs = new IntersectionObserver((entries) => {
          for (const e of entries) if (e.isIntersecting) { e.target.classList.add("on"); obs.unobserve(e.target); }
        }, { threshold: 0.15 });
        document.querySelectorAll(".reveal").forEach((el) => obs.observe(el));
      }

      document.querySelector("#reset").addEventListener("click", () => {
        // Restore every interactive value and visual state.
      });
    })();
  </script>
