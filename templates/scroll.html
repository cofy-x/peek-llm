  <title>Concept — Peek LLM</title>

  <!-- END THIRD-PARTY STYLES -->
  <style>
    /* Design tokens: keep in sync with templates/design-tokens.html.
       This shell provides layout mechanics; visual identity lives there. */
    :root {
      color-scheme: light;
      --bg: #f7f4ee;
      --ink: #17202e;
      --muted: #5d6b7f;
      --panel: #ffffff;
      --line: rgba(23, 32, 46, 0.14);
      --accent: #0d9488;
      --accent-ink: #0b6e65;
      --violet: #6d5ef0;
      --amber: #b45309;
      --rose: #d1365c;
      --green: #15803d;
      --blue: #1d6fd1;
      --orange: #c25e1a;
      --pink: #a03dc8;
      --radius: 24px;
      --ease: cubic-bezier(.2, .8, .2, 1);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    * { box-sizing: border-box; }

    body { margin: 0; min-height: 100vh; line-height: 1.55; background: radial-gradient(50rem 26rem at 85% -10%, rgba(13, 148, 136, 0.08), transparent 60%), radial-gradient(44rem 26rem at -8% 100%, rgba(109, 94, 240, 0.07), transparent 60%), var(--bg); }

    a { color: var(--accent-ink); }
    a:focus-visible, button:focus-visible { outline: 3px solid rgba(13, 148, 136, 0.4); outline-offset: 2px; }

    .shell { width: min(960px, calc(100% - 32px)); margin: 0 auto; padding: 26px 0 80px; }

    header.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 10px; color: var(--ink); font-weight: 760; letter-spacing: -0.02em; text-decoration: none; }
    .brand svg { width: 22px; height: 22px; color: var(--accent); }
    .label { margin: 0; color: var(--muted); font-size: 12.5px; letter-spacing: 0.11em; text-transform: uppercase; }

    h1 { margin: 34px 0 10px; font-size: clamp(40px, 7vw, 68px); line-height: 0.98; letter-spacing: -0.055em; }
    h1 span { color: transparent; background: linear-gradient(100deg, var(--accent), #14b8a6 45%, var(--violet)); background-clip: text; -webkit-background-clip: text; }
    h2 { margin: 0 0 6px; font-size: clamp(26px, 4vw, 36px); letter-spacing: -0.035em; }
    .signpost { margin: 0 0 18px; color: var(--muted); font-size: 16.5px; max-width: 620px; }

    section { margin-top: 72px; }
    .reveal { opacity: 0; transform: translateY(22px); transition: opacity 700ms var(--ease), transform 700ms var(--ease); }
    .reveal.on { opacity: 1; transform: none; }

    /* Hero stage: the primary interaction lives here, on the first screen. */
    .stage { margin-top: 26px; padding: 26px; border: 1px solid var(--line); border-radius: 32px; background: var(--panel); box-shadow: 0 24px 70px rgba(23, 32, 46, 0.1); }

    button { min-height: 44px; padding: 0 20px; border: 1px solid var(--line); border-radius: 13px; background: var(--panel); color: var(--ink); font: inherit; font-weight: 700; cursor: pointer; }
    button.primary { border-color: transparent; background: var(--accent); color: #fff; }
    button:disabled { opacity: 0.4; cursor: default; }

    footer { margin-top: 72px; padding-top: 22px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
    footer a { color: var(--muted); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-delay: 0ms !important; transition-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
      .reveal { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <a class="brand" href="../index.html" aria-label="Back to Peek LLM home">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><defs><linearGradient id="peekg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d9488"/><stop offset="1" stop-color="#6d5ef0"/></linearGradient></defs><path d="M2.5 12s3.5-5.4 9.5-5.4 9.5 5.4 9.5 5.4-3.5 5.4-9.5 5.4S2.5 12 2.5 12Z" stroke="url(#peekg)" stroke-width="1.8"/><rect x="8.2" y="8.2" width="7.6" height="7.6" rx="2.4" fill="url(#peekg)" stroke="none"/></svg>
        Peek LLM
      </a>
      <p class="label">Conceptual illustration · replace with the data label</p>
    </header>

    <main>
      <h1>One concept. <span>Zero paragraphs.</span></h1>
      <p class="signpost">One-line signpost: what the learner is about to see and do.</p>

      <div class="stage">
        <!-- The primary interaction lives here, above the fold. -->
        <button id="reset" type="button">Reset</button>
      </div>

      <section class="reveal" aria-labelledby="sources">
        <h2 id="sources">Sources</h2>
        <p class="signpost"><a href="https://example.com/primary-source" rel="noreferrer">Replace with a primary source</a></p>
      </section>
    </main>

    <footer>
      <span>Peek LLM · Concept · <a href="./index.html">Concept index</a></span>
      <span><a href="../index.html">Home</a> · <a href="https://github.com/cofy-x/peek-llm" rel="noreferrer">GitHub</a></span>
    </footer>
  </div>

  <script>
    (() => {
      "use strict";

      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      // Reveal sections as they enter the viewport; static under reduced motion.
      if (reducedMotion || !("IntersectionObserver" in window)) {
        document.querySelectorAll(".reveal").forEach((el) => el.classList.add("on"));
      } else {
        const obs = new IntersectionObserver((entries) => {
          for (const e of entries) if (e.isIntersecting) { e.target.classList.add("on"); obs.unobserve(e.target); }
        }, { threshold: 0.15 });
        document.querySelectorAll(".reveal").forEach((el) => obs.observe(el));
      }

      document.querySelector("#reset").addEventListener("click", () => {
        // Restore every interactive value and visual state.
      });
    })();
  </script>
